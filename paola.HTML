<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale="1.0">
    <title></title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            background-color: #ffe6ee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "Segoe UI", "sans-serif";
            overflow: hidden;
        }
        .heart {
            width: 120px;
            height: 120px;
            background-color: #ff4777;
            transform: rotate(-45deg);
            animation: beat 0.8s infinite;
            margin-bottom: 30px;
        }
        .heart::before,
        .heart::after {
            content: "";
            width: 120px;
            height: 120px;
            background-color: #ff4777;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before{ top: -60px; left : 0;}
        .heart::after{top: 0; right: -60px;}

        @keyframes beat{
            0%, 100%{transform: rotate(-45deg) scale(1);}
            50%     { transform: rotate(-45deg) scale(1.1);}
        }
        .text-box{
            font-size: 22px;
            color: #c8244f;
            margin-bottom: 40px;
            text-align: center;
            min-height: 60px;
            max-width:640px; 
            line-height:2; 
            letter-spacing:1px;
        }
        .fall-heart {
            position: fixed;
            color:#ff4777;
            font-size: 24px;
            animation: fall linear;
            pointer-events: none;
        }

        @keyframes fall {
            0% {top: -30px; opacity: 1;}
            100% {top: 100vh;opacity: 0;}
        }
    </style>
</head>
<body>
    <div class = "heart"></div>
    <div class ="text-box" id="typeText"></div>

    <script>
        const lines = [
        "Cada  día a tu lado se siente como un regalo.",
        "Tu risa es mi sonido favorito.",
        "Contigo el tiempo pasa sin darme cuenta.",
        "Eres mi pensamiento bonito de cada mañana.",
        "Me haces sonreír sin ninguna razón.",
        "Tengo ganas de cuidarte siempre."
        ];
        let lineIndex = 0;
         const el = document.getElementById("typeText");
         
function typeSentence(sentence, index = 0) {
            if(index < sentence.length){
                let char = sentence[index];
                // 如果是空格，替换成 &nbsp; 保证空格渲染出来
                if(char === " ") char = "&nbsp;";
                el.innerHTML += char;
                setTimeout(()=>{
                    typeSentence(sentence, index+1);
                },80);
            }else{
                setTimeout(()=>{
                    el.innerHTML = "";
                    lineIndex = (lineIndex + 1) % lines.length;
                    typeSentence(lines[lineIndex]);
                },2000);
            }
        }
        typeSentence(lines[lineIndex]);


         setInterval(() => {
         const h= document.createElement("div");
         h.className="fall-heart";
         h.innerText = "❤";
         h.style.left = Math.random()*100 +"vw";
         h.style.animationDuration = Math.random() * 2 +2 +"s";
         document.body.appendChild(h);
         setTimeout(() => h.remove(), 4000);
         }, 150);
    </script>
</body>
</html>
